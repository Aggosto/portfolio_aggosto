<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ARCHIVE</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="nav-container">

        <div class="logo">
            ARCHIVE
        </div>

        <nav>
            <a href="#digital">DIGITAL</a>
            <a href="#real">REAL</a>
            <a href="#videos">VIDEOS</a>
        </nav>

    </div>

</header>

<!-- =========================
     DIGITAL
========================= -->

<section class="section" id="digital">

    <button class="section-header" aria-expanded="false">
        <div class="section-title">DIGITAL</div>
        <span class="toggle-icon">+</span>
    </button>

    <div class="section-body" aria-hidden="true">
        <div class="projects"></div>
    </div>

</section>

<!-- =========================
     REAL
========================= -->

<section class="section" id="real">

    <button class="section-header" aria-expanded="false">
        <div class="section-title">REAL</div>
        <span class="toggle-icon">+</span>
    </button>

    <div class="section-body" aria-hidden="true">
        <div class="projects"></div>
    </div>

</section>


<!-- =========================
     VIDEOS
========================= -->

<section class="section" id="videos">

    <div class="section-title">
        VIDEOS
    </div>

    <div class="video-grid">

        <div class="video-card">

            <div class="video-thumb">

                <iframe
                    src="https://www.youtube.com/embed/VIDEO_ID_1"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="video-info">

                <div class="video-title">
                    GTA IV / CINEMATIC
                </div>

                <div class="video-description">
                    Experimental virtual cinematography and environmental storytelling.
                </div>

            </div>

        </div>

        <div class="video-card">

            <div class="video-thumb">

                <iframe
                    src="https://www.youtube.com/embed/VIDEO_ID_2"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="video-info">

                <div class="video-title">
                    STREET DOCUMENTARY
                </div>

                <div class="video-description">
                    Urban atmosphere captured through handheld photography and motion.
                </div>

            </div>

        </div>

    </div>

</section>

<footer>
    VISUAL ARCHIVE © 2026
</footer>

<div class="lightbox-overlay" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Cerrar imagen">×</button>
    <div class="lightbox-content">
        <img src="" alt="">
        <div class="lightbox-caption"></div>
    </div>
</div>

<script src="gallery-data.js"></script>
<script src="gallery.js"></script>

</body>
</html>
