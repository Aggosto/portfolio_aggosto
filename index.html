<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ARCHIVE</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="nav-container">

        <div class="logo">
            ARCHIVE
        </div>

        <nav>
            <a href="#digital">DIGITAL</a>
            <a href="#real">REAL</a>
            <a href="#videos">VIDEOS</a>
        </nav>

    </div>

</header>

<!-- =========================
     DIGITAL
========================= -->

<section class="section" id="digital">

    <div class="section-title">DIGITAL</div>

    <div class="projects">

        <div class="project" data-id="gtaiv">

            <button class="project-header" aria-expanded="false">
                <div class="project-title">GTA IV</div>
                <div class="project-actions">
                    <div class="caption">Serie / GTA IV</div>
                </div>
            </button>

            <div class="project-body" aria-hidden="true">

                <div class="carousel">
                    <button class="nav-btn prev" aria-label="Anterior">‹</button>
                    <div class="carousel-track">
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_america_flag.webp" alt="GTA IV - flag"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_camararribamesa.webp" alt="GTA IV - cámara sobre mesa"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_camvhsphotosmuseum.webp" alt="GTA IV - fotos VHS en museo"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_cementerio.webp" alt="GTA IV - cementerio"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_franciscementerio.webp" alt="GTA IV - cementerio Franciscano"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_cuchillopelea.webp" alt="GTA IV - pelea con cuchillo"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_interiorsofa.webp" alt="GTA IV - interior sofá"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_lanchas.webp" alt="GTA IV - lanchas"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_mesapool.webp" alt="GTA IV - mesa de pool"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_museum.webp" alt="GTA IV - museo"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_pasiajepinturamuelle.webp" alt="GTA IV - paseo pintura muelle"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_planopinturahelicoptero.webp" alt="GTA IV - plano pintura helicóptero"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtaiv_theemissarytower.webp" alt="GTA IV - torre Emissary"></div>
                        <div class="carousel-item"><img src="imagenes/digital/gtaiv/gtiv_fotodesdeventana.webp" alt="GTA IV - foto desde ventana"></div>
                    </div>
                    <button class="nav-btn next" aria-label="Siguiente">›</button>
                </div>

                <div class="project-footer">
                    <a class="view-all" href="imagenes/digital/gtaiv/">Ver todas</a>
                </div>

            </div>

        </div>

    </div>

</section>

<!-- =========================
     REAL
========================= -->

<section class="section" id="real">

    <div class="section-title">
        REAL
    </div>

    <div class="gallery-grid">

        <div class="gallery-item">
            <img src="imagenes/real/street_01.jpg" alt="">
            <div class="caption">
                NIGHT BUS STOP
            </div>
        </div>

        <div class="gallery-item">
            <img src="imagenes/real/street_02.jpg" alt="">
            <div class="caption">
                ALLEY LIGHT
            </div>
        </div>

        <div class="gallery-item">
            <img src="imagenes/real/street_03.jpg" alt="">
            <div class="caption">
                HUMAN SILENCE
            </div>
        </div>

    </div>

</section>

<!-- =========================
     VIDEOS
========================= -->

<section class="section" id="videos">

    <div class="section-title">
        VIDEOS
    </div>

    <div class="video-grid">

        <div class="video-card">

            <div class="video-thumb">

                <iframe
                    src="https://www.youtube.com/embed/VIDEO_ID_1"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="video-info">

                <div class="video-title">
                    GTA IV / CINEMATIC
                </div>

                <div class="video-description">
                    Experimental virtual cinematography and environmental storytelling.
                </div>

            </div>

        </div>

        <div class="video-card">

            <div class="video-thumb">

                <iframe
                    src="https://www.youtube.com/embed/VIDEO_ID_2"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="video-info">

                <div class="video-title">
                    STREET DOCUMENTARY
                </div>

                <div class="video-description">
                    Urban atmosphere captured through handheld photography and motion.
                </div>

            </div>

        </div>

    </div>

</section>

<footer>
    VISUAL ARCHIVE © 2026
</footer>

<div class="lightbox-overlay" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Cerrar imagen">×</button>
    <div class="lightbox-content">
        <img src="" alt="">
        <div class="lightbox-caption"></div>
    </div>
</div>

<script src="gallery-data.js"></script>
<script src="gallery.js"></script>

</body>
</html>
