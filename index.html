<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ARCHIVE</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="nav-container">

        <div class="logo">
            ARCHIVE
        </div>

        <nav>
            <a href="#digital">DIGITAL</a>
            <a href="#real">REAL</a>
            <a href="#videos">VIDEOS</a>
        </nav>

    </div>

</header>

<!-- =========================
     DIGITAL
========================= -->

<section class="section" id="digital">

    <button class="section-header" aria-expanded="false">
        <div class="section-header-label">
            <span class="section-index">01</span>
            <div class="section-title">DIGITAL</div>
        </div>
        <span class="toggle-icon">+</span>
    </button>

    <div class="section-body" aria-hidden="true">
        <div class="projects"></div>
    </div>

</section>

<!-- =========================
     REAL
========================= -->

<section class="section" id="real">

    <button class="section-header" aria-expanded="false">
        <div class="section-header-label">
            <span class="section-index">02</span>
            <div class="section-title">REAL</div>
        </div>
        <span class="toggle-icon">+</span>
    </button>

    <div class="section-body" aria-hidden="true">
        <div class="projects"></div>
    </div>

</section>


<!-- =========================
     VIDEOS
========================= -->

<section class="section" id="videos">

    <button class="section-header" aria-expanded="false">
        <div class="section-header-label">
            <span class="section-index">03</span>
            <div class="section-title">VIDEOS</div>
        </div>
        <span class="toggle-icon">+</span>
    </button>

    <div class="section-body" aria-hidden="true">
        <div class="video-grid">

            <article class="video-card">

                <div class="video-thumb">
                    <iframe
                        src="https://www.youtube.com/embed/VIDEO_ID_1"
                        allowfullscreen>
                    </iframe>
                </div>

                <div class="video-info">
                    <div class="video-title">01 / GTA IV CINEMATIC</div>
                    <div class="video-description">Experimental virtual cinematography and environmental storytelling.</div>
                </div>

            </article>

            <article class="video-card">

                <div class="video-thumb">
                    <iframe
                        src="https://www.youtube.com/embed/VIDEO_ID_2"
                        allowfullscreen>
                    </iframe>
                </div>

                <div class="video-info">
                    <div class="video-title">02 / STREET DOCUMENTARY</div>
                    <div class="video-description">Urban atmosphere captured through handheld photography and motion.</div>
                </div>

            </article>

        </div>
    </div>
</section>

<footer>
    VISUAL ARCHIVE © 2026
</footer>

<div class="lightbox-overlay" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Cerrar imagen">×</button>
    <button class="lightbox-prev" type="button" aria-label="Anterior">‹</button>
    <button class="lightbox-next" type="button" aria-label="Siguiente">›</button>
    <div class="lightbox-content">
        <div class="lightbox-img-wrap">
            <img src="" alt="">
        </div>
        <div class="lightbox-info">
            <div class="lightbox-meta-row">
                <span class="lightbox-title"></span>
                <span class="lightbox-counter"></span>
            </div>
            <div class="lightbox-detail"></div>
        </div>
    </div>
</div>

<script src="gallery-data.js"></script>
<script src="gallery.js"></script>

</body>
</html>
